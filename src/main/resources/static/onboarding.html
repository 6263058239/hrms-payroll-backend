<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Onboarding | KodeKrafters HRMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* PREMIUM SAAS ENTERPRISE BACKGROUND */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
            color: #1e293b;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Subtle Background Overlay Grid/Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(37, 99, 235, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 10%;
            left: 15%;
            z-index: 0;
        }

        /* Main Form Card Container */
        .form-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            width: 100%;
            max-width: 850px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Top Dark Header */
        .form-header {
            background: #0f172a;
            color: #ffffff;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        .form-header h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .form-header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .close-btn {
            color: #94a3b8;
            font-size: 20px;
            text-decoration: none;
            transition: 0.2s;
        }
        .close-btn:hover {
            color: #ffffff;
        }

        /* 3-Step Tab Header (NOW CLICKABLE & INTERACTIVE) */
        .tabs-header {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer; /* Pointer cursor for click indication */
            user-select: none;
        }
        .tab-item:hover {
            background: #f1f5f9;
            color: #2563eb;
        }
        .tab-item.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: #ffffff;
        }
        .tab-item.completed {
            color: #16a34a;
        }

        /* Form Body Padding */
        .form-body {
            padding: 32px;
        }

        .hidden-step {
            display: none !important;
        }

        .step-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Form Grid Layout (2 Columns) */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .full-width {
            grid-column: span 2;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .required-star {
            color: #ef4444;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
        }
        .form-input:focus, .form-select:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Checkbox Styling */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }
        .checkbox-label input {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
        }

        /* Footer Button Group */
        .btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .btn-btn {
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-back {
            background: #f1f5f9;
            color: #475569;
        }
        .btn-back:hover {
            background: #e2e8f0;
        }
        .btn-next {
            background: #2563eb;
            color: #ffffff;
            margin-left: auto;
        }
        .btn-next:hover {
            background: #1d4ed8;
        }
        .btn-submit {
            background: #16a34a;
            color: #ffffff;
            margin-left: auto;
        }
        .btn-submit:hover {
            background: #15803d;
        }
    </style>
</head>
<body>

<div class="form-card">

    <!-- Header -->
    <div class="form-header">
        <div>
            <h2><i class="fa-solid fa-user-plus" style="color: #3b82f6; margin-right: 8px;"></i> Employee Onboarding</h2>
            <p>3-Step Registration & Payroll Configuration</p>
        </div>
        <a href="/dashboard" class="close-btn"><i class="fa-solid fa-xmark"></i></a>
    </div>

    <!-- Tab Indicators -->
    <div class="tabs-header">
        <div id="tab-1" class="tab-item active" onclick="jumpToStep(1)">1. Personal Info</div>
        <div id="tab-2" class="tab-item" onclick="jumpToStep(2)">2. Salary Structure</div>
        <div id="tab-3" class="tab-item" onclick="jumpToStep(3)">3. Bank Details</div>
    </div>

    <!-- Form Body -->
    <form id="onboardingForm" class="form-body">

        <!-- STEP 1: Personal Details -->
        <div id="step-1">
            <h3 class="step-title">Step 1: Personal & Department Details</h3>

            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name <span class="required-star">*</span></label>
                    <input type="text" id="fullName" class="form-input" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label>Email Address <span class="required-star">*</span></label>
                    <input type="email" id="email" class="form-input" placeholder="john.doe@company.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number <span class="required-star">*</span></label>
                    <input type="tel" id="phone" class="form-input" placeholder="+91 9876543210" required>
                </div>

                <div class="form-group">
                    <label>Department <span class="required-star">*</span></label>
                    <select id="department" class="form-select" required>
                        <option value="IT" selected>IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Operations">Operations</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Designation <span class="required-star">*</span></label>
                    <input type="text" id="designation" class="form-input" placeholder="e.g. Software Engineer" required>
                </div>

                <div class="form-group">
                    <label>Date of Joining <span class="required-star">*</span></label>
                    <input type="date" id="dateOfJoining" class="form-input" required>
                </div>
            </div>
        </div>

        <!-- STEP 2: Salary Structure -->
        <div id="step-2" class="hidden-step">
            <h3 class="step-title">Step 2: Salary Structure (Payroll Engine)</h3>

            <div class="form-grid">
                <div class="form-group">
                    <label>Basic Salary (₹)</label>
                    <input type="number" id="basicSalary" class="form-input" placeholder="50000">
                </div>

                <div class="form-group">
                    <label>HRA Allowance (₹)</label>
                    <input type="number" id="hra" class="form-input" placeholder="20000">
                </div>

                <div class="form-group">
                    <label>Dearness Allowance - DA (₹)</label>
                    <input type="number" id="da" class="form-input" placeholder="5000">
                </div>

                <div class="form-group">
                    <label>Special Allowance (₹)</label>
                    <input type="number" id="specialAllowance" class="form-input" placeholder="10000">
                </div>

                <div class="form-group full-width" style="margin-top: 10px;">
                    <label style="font-weight: 700; color: #0f172a;">Statutory Deductions Config</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="pfApplicable" checked> Enable Provident Fund (PF) Contribution
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="ptApplicable" checked> Enable Professional Tax (PT) Deduction
                        </label>
                        <!-- ⚡ NEW TDS CHECKBOX -->
                        <label class="checkbox-label">
                            <input type="checkbox" id="tdsApplicable" checked> Enable Income Tax (TDS) Deduction (10%)
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- STEP 3: Bank Details -->
        <div id="step-3" class="hidden-step">
            <h3 class="step-title">Step 3: Bank Details</h3>

            <div class="form-grid">
                <div class="form-group">
                    <label>Bank Name</label>
                    <select id="bankName" class="form-select">
                        <option value="HDFC Bank" selected>HDFC Bank</option>
                        <option value="ICICI Bank">ICICI Bank</option>
                        <option value="State Bank of India">State Bank of India</option>
                        <option value="Axis Bank">Axis Bank</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Account Number</label>
                    <input type="text" id="accountNumber" class="form-input" placeholder="Enter Account Number">
                </div>

                <div class="form-group">
                    <label>IFSC Code</label>
                    <input type="text" id="ifscCode" class="form-input" placeholder="e.g. HDFC0001234">
                </div>

                <div class="form-group">
                    <label>PAN Number</label>
                    <input type="text" id="panNumber" class="form-input" style="text-transform: uppercase;" placeholder="e.g. ABCDE1234F">
                </div>

                <div class="form-group full-width">
                    <label>Aadhaar Number</label>
                    <input type="text" id="aadhaarNumber" class="form-input" placeholder="Enter Aadhaar Number">
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="btn-group">
            <button type="button" id="backBtn" class="btn-btn btn-back hidden-step">Back</button>
            <button type="button" id="nextBtn" class="btn-btn btn-next">Next</button>
            <button type="submit" id="submitBtn" class="btn-btn btn-submit hidden-step">Submit Onboarding</button>
        </div>

    </form>
</div>

<!-- VANILLA JS INTEGRATED WITH SPRING BOOT BACKEND -->
<script>
    let currentStep = 1;

    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');

    const tab1 = document.getElementById('tab-1');
    const tab2 = document.getElementById('tab-2');
    const tab3 = document.getElementById('tab-3');

    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');
    const submitBtn = document.getElementById('submitBtn');

    // Steps Change Logic
    function updatePage() {
        if (currentStep === 1) {
            step1.classList.remove('hidden-step');
            step2.classList.add('hidden-step');
            step3.classList.add('hidden-step');

            tab1.className = "tab-item active";
            tab2.className = "tab-item";
            tab3.className = "tab-item";

            backBtn.classList.add('hidden-step');
            nextBtn.classList.remove('hidden-step');
            submitBtn.classList.add('hidden-step');
        }
        else if (currentStep === 2) {
            step1.classList.add('hidden-step');
            step2.classList.remove('hidden-step');
            step3.classList.add('hidden-step');

            tab1.className = "tab-item completed";
            tab2.className = "tab-item active";
            tab3.className = "tab-item";

            backBtn.classList.remove('hidden-step');
            nextBtn.classList.remove('hidden-step');
            submitBtn.classList.add('hidden-step');
        }
        else if (currentStep === 3) {
            step1.classList.add('hidden-step');
            step2.classList.add('hidden-step');
            step3.classList.remove('hidden-step');

            tab1.className = "tab-item completed";
            tab2.className = "tab-item completed";
            tab3.className = "tab-item active";

            backBtn.classList.remove('hidden-step');
            nextBtn.classList.add('hidden-step');
            submitBtn.classList.remove('hidden-step');
        }
    }

    // Step 1 Validation
    function validateStep1() {
        const inputs = step1.querySelectorAll('input[required], select[required]');
        for (let input of inputs) {
            if (!input.checkValidity()) {
                input.reportValidity();
                return false;
            }
        }
        return true;
    }

    // Tab Jump Handling
    function jumpToStep(targetStep) {
        if (targetStep < currentStep) {
            currentStep = targetStep;
            updatePage();
        }
        else if (targetStep > currentStep) {
            if (currentStep === 1 && !validateStep1()) return;
            currentStep = targetStep;
            updatePage();
        }
    }

    nextBtn.addEventListener('click', function() {
        if (currentStep === 1 && !validateStep1()) return;
        if (currentStep < 3) {
            currentStep++;
            updatePage();
        }
    });

    backBtn.addEventListener('click', function() {
        if (currentStep > 1) {
            currentStep--;
            updatePage();
        }
    });

    // ========================================================
    // BACKEND API INTEGRATION (EXACT MAP WITH EMPLOYEE ENTITY)
    // ========================================================
    document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Onboarding...`;

        // Employee Payload mapped directly to Employee.java Entity
        const employeePayload = {
            employeeName: document.getElementById('fullName').value.trim(),
            officialEmail: document.getElementById('email').value.trim(),
            contactNumber: document.getElementById('phone').value.trim(),
            department: document.getElementById('department').value,
            designation: document.getElementById('designation').value.trim(),
            dateOfJoining: document.getElementById('dateOfJoining').value,
            bankName: document.getElementById('bankName').value,
            accountNumber: document.getElementById('accountNumber').value.trim(),
            ifscCode: document.getElementById('ifscCode').value.trim(),
            panNumber: document.getElementById('panNumber').value.trim(),
            employeeStatus: 'ONBOARDING'
        };

        try {
            // STEP 1: Save Employee to DB
            const empResponse = await fetch('http://localhost:8080/api/v1/employees', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(employeePayload)
            });

            if (!empResponse.ok) {
                const errRes = await empResponse.json().catch(() => null);
                const detailMsg = (errRes && errRes.message) ? errRes.message : "Failed to onboarding employee (check duplicate email).";
                throw new Error(detailMsg);
            }

            const savedEmployee = await empResponse.json();
            const generatedEmpId = savedEmployee.empId;

            // STEP 2: Save Salary Structure for the generated Employee ID
            const pfApplicable = document.getElementById('pfApplicable')?.checked;
            const ptApplicable = document.getElementById('ptApplicable')?.checked;
            const tdsApplicable = document.getElementById('tdsApplicable')?.checked; // ⚡ TDS Checkbox

            const basicSalaryVal = parseFloat(document.getElementById('basicSalary').value) || 0.0;

            // ⚡ TDS Calculation: Basic Salary ka 10%
            const calculatedTds = tdsApplicable ? (basicSalaryVal * 0.10) : 0.0;

            const salaryPayload = {
                employee: { empId: generatedEmpId },
                basicSalary: basicSalaryVal,
                hra: parseFloat(document.getElementById('hra').value) || 0.0,
                da: parseFloat(document.getElementById('da').value) || 0.0,
                specialAllowance: parseFloat(document.getElementById('specialAllowance').value) || 0.0,
                pfEmployeeContribution: pfApplicable ? 1800.00 : 0.00,
                professionalTax: ptApplicable ? 200.00 : 0.00,
                tdsIncomeTax: calculatedTds, // ⚡ Entity field `tdsIncomeTax` DB mapping
                currency: "INR",
                payFrequency: "MONTHLY"
            };

            const salaryResponse = await fetch('http://localhost:8080/api/v1/salary-structures', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(salaryPayload)
            });

            if (!salaryResponse.ok) {
                throw new Error("Employee saved, but Salary Structure mapping failed.");
            }

            // Success Popup
            alert(`🎉 Onboarding Successful!\nEmployee ID: ${generatedEmpId}\nName: ${savedEmployee.employeeName}`);

            document.getElementById('onboardingForm').reset();
            currentStep = 1;
            updatePage();

        } catch (error) {
            console.error("API Error:", error);
            alert("❌ Error: " + error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `Submit Onboarding`;
        }
    });
</script>
</body>
</html>
