<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up for HRMS Payroll | KodeKrafters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
        /* 👉 CHANGE 1: Zoho jaisa high-quality office style background image lagaya */
        background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        /* 👉 BUG FIX 1: 'align=items' ko thik karke 'align-items' kiya */
        align-items: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        }

        /* 👉 CHANGE 2: Pure background par ek elegant light white overlay mask lagaya */
        body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.65); /* 65% transparent white layer */
        backdrop-filter: blur(4px); /* Premium halke glass effect ke liye blur */
        z-index: 0;
        }

        /* Background ke halke circles ko overlay ke peeche bheja aur transparent kiya */
        body::after{
        content: '';
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: rgba(30, 144, 255, 0.04);
        z-index: 0;
        bottom: -100px;
        right: -100px;
        }

        .signup-container{
        width: 100%;
        max-width: 500px;
        text-align: center;
        /* 👉 CHANGE 3: Isko overlay ke upar chamkane ke liye z-index badhaya */
        position: relative;
        z-index: 1;
        }

        /* Brand Header Styling */
        .brand-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 26px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 8px;
        }

        .brand-logo i{
        color: #0066cc; /* KodeKrafters theme color */
        }

        .tagline {
        font-size: 20px;
        color: #475569;
        margin-bottom: 25px;
        }

        .tagline span{
        color: #0066cc;
        font-weight: 600;
        }

        /* White Signup Card Window */
        .signup-card{
        background: #ffffff;
        padding: 40px 35px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Form Input Container */
        .input-group {
        position: relative;
        margin-bottom: 20px;
        }

        .input-group i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-size: 16px;
        }

        .input-group input, .input-group select{
        width: 100%;
        padding: 14px 15px 14px 45px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 15px;
        color: #334155;
        outline: none;
        /* 👉 BUG FIX 2: 'transaction' ko thik karke 'transition' kiya */
        transition: all 0.3s ease;
        background-color: #f8fafc;
        }

        .input-group input:focus, .input-group select:focus{
        border-color: #0066cc;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        /* Location Dropdown customization */
        .input-group select {
        appearance: none;
        cursor: pointer;
        }

        .input-group::after{
        content: '\f107';
        font-family: 'Font Awesome 5 Free';
        font-weight: 900;
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        pointer-events: none;
        }

        .input-group.no-arrow::after{
        display: none;
        }

        /* Checkbox & Terms styling */
        .terms-container{
        text-align: left;
        font-size: 13px;
        color: #64748b;
        margin-bottom: 25px;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        line-height: 1.4;
        }

        .terms-container input{
        margin-top: 3px;
        cursor: pointer;
        }

        .terms-container a{
        color: #0066cc;
        text-decoration: none;
        }

        .terms-container a:hover{
        text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
        width: 100%;
        padding: 14px;
        background-color: #0066cc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
        }

        .btn-submit:hover{
        background-color: #0052a3;
        }

        /* Social Sign In */
        .social-divider {
        margin: 25px 0;
        position: relative;
        font-size: 13px;
        color: #94a3b8;
        }

        .social-divider::before, .social-divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 35%;
        height: 1px;
        background-color: #e2e8f0;
        }

        .social-divider::before { left: 0; }
        .social-divider::after { right: 0; }

        .social-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 25px;
        }

        .social-icons a {
        width: 40px;
        height: 40px;
        border: 1px solid #e2e8f0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        text-decoration: none;
        font-size: 18px;
        transition: all 0.2s ease;
        }

        .social-icons a:hover{
        background-color: #f1f5f9;
        color: #334155;
        transform: translateY(-2px);
        }

        .footer-text {
        font-size: 14px;
        color: #64748b;
        }

        .footer-text a {
        color: #0066cc;
        text-decoration: none;
        font-weight: 600;
        }
    </style>
</head>
<body>
  <div class="signup-container">
      <!-- Brand Header Section -->
      <div class="brand-logo">
       <i class="fa-solid fa-laptop-code"></i>
          <span>KodeKrafters</span>
      </div>
      <div class="tagline">
          Your payroll process is about to get a <span>whole lot easier</span>
      </div>
      <!-- Main Card Form -->
      <div class="signup-card">
          <form th:action="@{/signup}" th:object="${registerRequest}" method="POST">

              <!-- 🚨 Error Message Box: Agar duplicate email aayi toh screen par red color me dikhegi -->
              <div th:if="${error}" style="color: #dc2626; background-color: #fee2e2; border: 1px solid #fca5a5; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; font-weight: 500; text-align: left;">
                  <i class="fa-solid fa-circle-exclamation" style="color: #dc2626; margin-right: 5px;"></i>
                  <span th:text="${error}">Error Message</span>
              </div>

              <!-- Company Name (DTO field: companyName) -->
              <div class="input-group no-arrow">
                  <i class="fa-regular fa-building"></i>
                  <input type="text" th:field="*{companyName}" placeholder="Company Name" required>
              </div>

              <!-- Country (Mapped to State UI for now to match DTO field: country) -->
              <div class="input-group">
                  <i class="fa-solid fa-location-dot"></i>
                  <select th:field="*{country}" required>
                      <option value="India" selected>India</option>
                      <option value="USA">United States</option>
                      <option value="UK">United Kingdom</option>
                  </select>
              </div>

              <!-- Billing Currency (Mapped to Phone UI for now to match DTO field: billingCurrency) -->
              <div class="input-group">
                  <i class="fa-solid fa-wallet"></i>
                  <select th:field="*{billingCurrency}" required>
                      <option value="INR" selected>INR (₹)</option>
                      <option value="USD">USD ($)</option>
                      <option value="EUR">EUR (€)</option>
                  </select>
              </div>

              <!-- Email Address (DTO field: email) -->
              <div class="input-group no-arrow">
                  <i class="fa-regular fa-envelope"></i>
                  <input type="email" th:field="*{email}" placeholder="Email Address" required>
              </div>

              <!-- Password (DTO field: password) -->
              <div class="input-group no-arrow">
                  <i class="fa-solid fa-lock"></i>
                  <input type="password" th:field="*{password}" placeholder="Password" required>
              </div>

              <div class="terms-container">
                  <input type="checkbox" id="terms" required>
                  <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
              </div>

              <button type="submit" class="btn-submit">Create Free Account</button>
              <div class="social-divider">Or sign in using</div>
              <div class="social-icons">
                  <a href="#"><i class="fa-brands fa-google"></i></a>
                  <a href="#"><i class="fa-brands fa-facebook"></i></a>
                  <a href="#"><i class="fa-brands fa-twitter"></i></a>
                  <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
              </div>

              <div class="footer-text">
                  Already have a KodeKrafters account? <a href="/login">Sign In</a>
              </div>
          </form>
      </div>
  </div>
</body>
</html>
